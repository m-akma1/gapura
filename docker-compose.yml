name: gapura

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
      - "127.0.0.1:5672:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  migrator:
    build:
      context: .
      dockerfile: docker/migrator.Dockerfile
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      AUTH_ISSUER: ${AUTH_ISSUER}
      KERATON_BASE_URL: ${KERATON_BASE_URL}
      JOGLO_BASE_URL: ${JOGLO_BASE_URL}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      KERATON_CLIENT_ID: ${KERATON_CLIENT_ID}
      KERATON_CLIENT_SECRET: ${KERATON_CLIENT_SECRET}
      JOGLO_CLIENT_ID: ${JOGLO_CLIENT_ID}
      JOGLO_CLIENT_SECRET: ${JOGLO_CLIENT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  auth-server:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        SERVICE_PATH: auth-provider/server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/gapura
      AUTH_ISSUER: ${AUTH_ISSUER}
      AUTH_CODE_TTL_SECONDS: ${AUTH_CODE_TTL_SECONDS}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      CENTRAL_SESSION_TTL_SECONDS: ${CENTRAL_SESSION_TTL_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  control-panel:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args:
        SERVICE_PATH: auth-provider/control-panel
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/gapura
      AUTH_ISSUER: ${AUTH_ISSUER}
      LOG_LEVEL: ${LOG_LEVEL}
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/admin/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks:
      default:
        # Name resolved inside the network in /etc/hosts
        # Add this line to /etc/hosts for clean URL for dev/testing
        # 127.0.0.1  auth.gapura.test keraton.gapura.test joglo.gapura.test
        aliases:
          - auth.gapura.test
          - keraton.gapura.test
          - joglo.gapura.test

volumes:
  postgres-data:
  rabbitmq-data:
  caddy-data:
